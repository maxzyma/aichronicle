name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:publication
      - run: npm run review:report && git diff --exit-code -- research/reviews/initial-review.md
      - run: git diff-tree --check --root HEAD
