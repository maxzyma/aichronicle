name: Candidates
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation-state
          path: .runtime/state
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Collect public leads
        id: collection
        continue-on-error: true
        run: npm run collect
        env:
          STATE_FILE: .runtime/state/state.json
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist watermarks and candidate evidence
        if: always() && steps.collection.outcome != 'skipped'
        working-directory: .runtime/state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- state.json
          if ! git diff --cached --quiet -- state.json; then
            git commit -m "chore: update candidate state" -- state.json
            git push origin HEAD:automation-state
          fi
      - name: Determine report window
        id: window
        if: always()
        run: |
          if [ "$(date -u +%H)" -lt 6 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build daily and weekly review packets
        if: always() && steps.window.outputs.daily == 'true' && steps.collection.outcome != 'skipped'
        env:
          STATE_FILE: .runtime/state/state.json
        run: |
          npm run candidates:report
          if [ "$(date -u +%u)" = 1 ]; then
            npm run candidates:report -- --weekly
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.window.outputs.daily == 'true'
        with:
          name: candidate-review-${{ github.run_id }}
          path: .runtime/reports
          include-hidden-files: true
          retention-days: 30
      - name: Surface source failures
        if: steps.collection.outcome == 'failure'
        run: exit 1
